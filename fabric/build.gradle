plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation "curse.maven:better-combat-by-daedelus-639842:$rootProject.better_combat_fabric"
    modImplementation "curse.maven:playeranimator-658587:$rootProject.player_animator_fabric"
    modCompileOnly "curse.maven:spell-engine-807653:$rootProject.spell_engine_fabric"
    modCompileOnly "curse.maven:spell-power-771265:$rootProject.spell_power_fabric"

    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version"
    modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"
    modCompileOnly "curse.maven:trinkets-341284:$rootProject.trinkets_fabric"
    modCompileOnly "curse.maven:critical-strike-1379562:$rootProject.critical_strike_fabric"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cardinal_components_version"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.cardinal_components_version"

    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
